<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="책, 편집, 그래픽. 김가을의 디자인 작업을 한 권씩 펼쳐 보는 서가.">
  <title>김가을 — 편집 디자인 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="projects.js"></script>
  <script defer src="jackets.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="identity" href="#works" aria-label="김가을, 포트폴리오">
      <svg class="mark" viewBox="0 0 34 36" fill="none" aria-hidden="true">
        <path d="M5 7h21l3 4v18H8l-3-3V7Z M5 25h21V7 M8 29v-4 M10 11h11 M10 15h11 M10 19h7" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span><strong>김가을</strong><small>포트폴리오</small></span>
    </a>
    <button class="index-button" type="button" aria-haspopup="dialog"><span>목차</span><span class="index-icon" aria-hidden="true">☰</span></button>
  </header>

  <nav class="rail" aria-label="작업 탐색">
    <a class="back" href="#works" hidden aria-label="서가로 돌아가기">←</a>
    <div class="ticks"></div>
  </nav>

  <main>
    <section class="shelf" aria-labelledby="shelf-title">
      <div class="intro">
        <div class="intro-copy">
          <p>편집디자인 포트폴리오</p>
          <h1>좋은 이야기를 더 잘 읽히고,<br>오래 기억되게 만드는</h1>
          <p class="intro-byline">편집 디자이너 김가을입니다.</p>
          <a href="#shelf-title" class="browse">작업 둘러보기 <span aria-hidden="true">↓</span></a>
        </div>
        <img src="assets/profile-4.webp" width="600" height="888" alt="편집디자이너 김가을의 인물 사진" fetchpriority="high">
      </div>
      <div class="shelf-inner">
        <div class="shelf-label"><h2 id="shelf-title">선별 작업</h2><span>01 — <span id="total"></span></span></div>
        <div id="books"></div>
        <footer class="colophon"><span>김가을 · 디자인 포트폴리오</span><a href="#works" id="top">맨 위로 ↑</a></footer>
      </div>
    </section>
    <section class="detail" hidden aria-labelledby="detail-title"></section>
  </main>

  <dialog class="index-dialog" aria-labelledby="index-title">
    <div class="index-heading"><h2 id="index-title">목차</h2><button type="button" class="close-index" aria-label="목차 닫기">×</button></div>
    <nav class="index-list" aria-label="전체 작업"></nav>
  </dialog>
  <noscript>포트폴리오를 열려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
